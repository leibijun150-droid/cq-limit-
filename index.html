<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">
<title>重庆桥隧限行顾问</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,
 "PingFang SC","Microsoft YaHei",
 sans-serif;margin:0;
 padding:0 14px 24px;color:#1f2937;
 background:linear-gradient(
 180deg,#eef3fb,#f7f9fc);
 min-height:100vh}
h3{margin:0 -14px 18px;
 padding:24px 14px 26px;
 font-size:20px;font-weight:600;
 color:#fff;letter-spacing:.5px;
 background:linear-gradient(
 135deg,#2563eb,#1d4ed8);
 border-radius:0 0 22px 22px;
 box-shadow:0 6px 20px
 rgba(37,99,235,.25)}
label{display:block;margin:14px 0 6px;
 font-size:13px;color:#64748b;
 font-weight:500}
input,select{width:100%;
 padding:12px 14px;font-size:16px;
 color:#1f2937;background:#fff;
 border:1.5px solid #e2e8f0;
 border-radius:12px;outline:none;
 transition:.2s;-webkit-appearance:none}
input:focus,select:focus{
 border-color:#2563eb;
 box-shadow:0 0 0 4px
 rgba(37,99,235,.12)}
button{width:100%;padding:15px;
 margin-top:20px;font-size:17px;
 font-weight:600;color:#fff;
 background:linear-gradient(
 135deg,#2563eb,#1d4ed8);
 border:0;border-radius:14px;
 box-shadow:0 6px 16px
 rgba(37,99,235,.3);
 transition:.15s}
button:active{transform:translateY(2px);
 box-shadow:0 2px 8px
 rgba(37,99,235,.3)}
button:disabled{opacity:.7;
 transform:none}
.wheel{display:flex;align-items:center;
 height:150px;position:relative;
 background:#fff;border-radius:14px;
 border:1.5px solid #e2e8f0;
 overflow:hidden}
.wheel::before{content:"";
 position:absolute;left:8px;right:8px;
 top:50px;height:50px;z-index:1;
 pointer-events:none;
 background:rgba(37,99,235,.07);
 border-radius:10px;
 border-top:1.5px solid
 rgba(37,99,235,.25);
 border-bottom:1.5px solid
 rgba(37,99,235,.25)}
.col{flex:1;height:150px;
 overflow-y:scroll;text-align:center;
 scroll-snap-type:y mandatory;
 position:relative;z-index:2}
.col::-webkit-scrollbar{display:none}
.item{height:50px;line-height:50px;
 font-size:24px;font-weight:600;
 color:#475569;
 scroll-snap-align:center}
.pad{height:50px}
.colon{font-size:24px;font-weight:700;
 color:#2563eb;padding:0 6px;z-index:2}
.card{background:#fff;padding:18px;
 border-radius:16px;margin-top:18px;
 box-shadow:0 4px 16px
 rgba(15,23,42,.06);
 line-height:1.7;font-size:15px}
.c{font-size:22px;font-weight:700;
 color:#dc2626;margin-bottom:12px;
 padding-bottom:10px;
 border-bottom:1px solid #f1f5f9}
.tip{color:#94a3b8;font-size:12px;
 text-align:center;margin-top:20px;
 line-height:1.6}
::placeholder{color:#b8c2d1;opacity:1}</style>
</head>
<body>

<h3>重庆桥隧限行智能出行顾问</h3>
<label>车牌</label><div style="position:relative"><input id="plate" value="" placeholder="如:渝A8F2K6" style="padding-right:38px"><a onclick=cl(0) style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#b8c2d1;font-size:20px;line-height:1;cursor:pointer">&#215;</a></div><label>车型</label>
<select id="vt"></select>
<label>日期</label><input type="date" id="dt"><label>星期（自动）</label>
<select id="wd" disabled></select>
<label>时间（上下滑动）</label>
<div class="wheel">
<div class="col" id="colH"></div>
<div class="colon">:</div>
<div class="col" id="colM"></div>
</div>
<input type="hidden" id="th" value="7">
<input type="hidden" id="tm" value="30"><div id="cd" style="margin-top:8px;font-size:13px;color:#64748b"></div>
<label>桥隧</label><div style="position:relative"><input id="rs" value="" placeholder="如:黄花园大桥" autocomplete="off" style="padding-right:38px"><a onclick=cl(1) style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#b8c2d1;font-size:20px;line-height:1;cursor:pointer">&#215;</a></div><div id="sug" style="display:none;margin-top:8px;line-height:1"></div><div id="rec" style="display:none;margin-top:10px;line-height:1"></div><datalist id="brl"></datalist>
<div id="hint" style="display:none;margin-top:14px;padding:10px 14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;font-size:14px;color:#c2410c"></div><button onclick="run(this)">判断限行</button>
<div class="card" id="out">填好点按钮</div>
<p class="tip">© 2026 重庆交通大学  交通运输学院 交通设备与控制工程2602 陈文强 · 仅供参考，请以交管部门
最新公告为准。核实：023-12123</p>
<script>

var WD=["","周一","周二","周三",
        "周四","周五","周六","周日"];
var TAIL={"1":"16","2":"27","3":"38",
          "4":"49","5":"50"};
var AM=[420,540];
var PM=[1020,1170];
var VT=["汽油小客车","新能源小客车",
        "外地号牌小客车","轻型货车",
        "重型货车","巡游出租汽车",
        "公共汽车"];
var BR=["高家花园大桥",
        "高家花园大桥复线桥",
        "石门大桥","嘉华大桥",
        "渝澳大桥","嘉陵江牛角沱大桥",
        "黄花园大桥","千厮门大桥",
        "朝天门大桥","东水门大桥",
        "石板坡长江大桥",
        "石板坡长江大桥复线桥",
        "菜园坝大桥","鹅公岩大桥",
        "曾家岩大桥","双碑大桥",
        "大佛寺长江大桥","红岩村大桥",
        "马桑溪长江大桥","李家沱大桥",
        "李家沱长江复线桥",
        "真武山隧道","双碑隧道",
        "大学城隧道","中梁山隧道"];
var FREE=["绕城高速","外环高速",
          "轨道1号线","轨道3号线",
          "轨道6号线","轨道环线"];

function val(id){
  return document.getElementById(id).value;
}
function hit(n,a){
  for(var i=0;i<a.length;i++){
    if(a[i].indexOf(n)>=0||
       n.indexOf(a[i])>=0) return a[i];
  }
  return null;
}

function judge(p,vt,wd,mi,roads,ho){
  var raw=p.toUpperCase().replace(/ /g,"");
  var ds=raw.match(/\d/g)||[];
  var tail=ds.length?ds[ds.length-1]:"";
  var ne=/新能源|电动|绿牌|插电|增程/
         .test(vt);
  if(raw.length>=8&&
     "DF".indexOf(raw[2])>=0) ne=true;
  var truck=/货车|卡车/.test(vt);
  var free=/出租|巡游|网约|公交|公共汽车|巴士/
           .test(vt);
  var moto=/摩托/.test(vt);
  var am=mi>=AM[0]&&mi<=AM[1];
  var pm=mi>=PM[0]&&mi<=PM[1];
  var peak=am?"早高峰 07:00—09:00":
      (pm?"晚高峰 17:00—19:30":"");
  var lim=[],unk=[];
  for(var i=0;i<roads.length;i++){
    var r=roads[i];
    if(!r) continue;
    var a=hit(r,BR);
    if(a) lim.push(a);
    else if(!hit(r,FREE)) unk.push(r);
  }
  var road=lim.join("、");
  if(moto) return ["不限行",
    "摩托车不属于汽车，不在"+
    "错峰通行车辆范围内。",
    "可正常通行。"];
  if(truck){
    if(peak&&lim.length) return ["限行",
      "货车须先执行小客车错峰"+
      "规定，另须持货车通行证。",
      "错峰或绕行，或办货车"+
      "通行证。"];
    return ["需办证",
      "货运车辆进入中心城区"+
      "须持有效通行证。",
      "办证：交管12123 APP、"+
      "重庆交巡警公众号。"];
  }
  if(ho) return ["不限行",
    "今天是法定节假日，当日"+
    "不实施桥隧错峰通行。",
    "按原路线通行。"];
  if(wd<1||wd>5) return ["不限行",
    "今天是周末；因法定节假"+
    "日调休而上班的周末同样"+
    "不实施错峰通行。",
    "按原路线通行。"];
  if(!lim.length) return ["不限行",
    "该通道不在错峰通行区域"+
    "清单内，不受工作日高峰"+
    "尾号限行限制。",
    "可正常通行。若桥隧名字"+
    "写错，请核对后重试。"];
  if(!peak) return ["不限行",
    "错峰时段为工作日早高峰"+
    " 07:00—09:00、晚高峰"+
    " 17:00—19:30，当前不在"+
    "时段内。",
    "可正常通行。"];
  if(ne) return ["不限行",
    "悬挂新能源号牌车辆不受"+
    "错峰通行限制。",
    "可在"+peak+"正常通行 "+
    road+"。"];
  if(free) return ["不限行",
    "出租车（含网约车）、"+
    "公交客车不受错峰通行限制。",
    "可在"+peak+"正常通行 "+
    road+"。"];
  var l=TAIL[wd]||"";
  if(!tail) return ["信息不全",
    "车牌尾号没识别出来。",
    "请补充车牌号码。"];
  if(l.indexOf(tail)>=0) return ["限行",
    "错峰规则："+WD[wd]+"限行尾号 "+
    l+"，你的尾号是 "+tail+"。"+
    peak+"禁行 "+road+"。",
    "错峰：07:00 前 / 09:00 后、"+
    "17:00 前 / 19:30 后通过。"];
  return ["不限行",
    "错峰规则："+WD[wd]+"限行尾号 "+
    l+"，你的尾号 "+tail+
    " 不在其中。",
    "可在"+peak+"正常通行 "+
    road+"。"];
}

function fill(id,n,v){
  var c=document.getElementById(id);
  var h="<div class=pad></div>";
  for(var i=0;i<n;i++){
    var s=("0"+i).slice(-2);
    h+="<div class=item>"+s+"</div>";
  }
  h+="<div class=pad></div>";
  c.innerHTML=h;
  c.scrollTop=v*50;
}
function bind(id,hid){
  var c=document.getElementById(id);
  c.addEventListener("scroll",function(){
    var i=Math.round(c.scrollTop/50);
    var a=c.querySelectorAll(".item");
    if(i>=0&&i<a.length)
      document.getElementById(hid).value=
        a[i].textContent;
  });
}
function save(){
  try{
    var k=["plate","vt","rs"];
    for(var i=0;i<k.length;i++)
      localStorage.setItem("cq"+k[i],
                           val(k[i]));
  }catch(e){}
}
function load(){
  try{
    var k=["plate","vt","rs"];
    for(var i=0;i<k.length;i++){
      var v=localStorage.getItem("cq"+k[i]);
      if(v) document.getElementById(k[i]).value=v;
    }
  }catch(e){}
}
function run(b){
  if(b){b.disabled=true;
    b.textContent="判断中…";}
  document.getElementById("out").innerHTML=
    "<b>正在判断…</b>";
  setTimeout(function(){
    var mi=parseInt(val("th"))*60+
           parseInt(val("tm"));
    var roads=val("rs").replace(/，/g,",")
              .split(",");
    var r=judge(val("plate"),val("vt"),
                parseInt(val("wd")),mi,roads,hoNow());
    save();
    try{ra(val("rs"));}catch(x){}
    var d=new Date();
    var bj=new Date(d.getTime()+
        d.getTimezoneOffset()*60000+
        8*3600000);
    var t2=("0"+bj.getHours()).slice(-2)+":"+
           ("0"+bj.getMinutes()).slice(-2)+":"+
           ("0"+bj.getSeconds()).slice(-2);
    document.getElementById("out").innerHTML=
      "<div class='c'>结论："+r[0]+"</div>"+
      "<p><b>依据</b><br>"+r[1]+"</p>"+
      "<p><b>建议</b><br>"+r[2]+"</p>"+
      "<p style='color:#999;font-size:12px'>"+
      "本次判断 "+t2+"</p>";
    if(b){b.disabled=false;
      b.textContent="判断限行";}
    try{
      document.getElementById("out")
        .scrollIntoView({behavior:"smooth",
                         block:"center"});
    }catch(e){}
  },80);
}
var S1=document.getElementById("vt");
var S2=document.getElementById("wd");
for(var i=0;i<VT.length;i++)
  S1.innerHTML+="<option>"+VT[i]+"</option>";
for(var i=1;i<=7;i++)
  S2.innerHTML+="<option value="+i+">"+
                WD[i]+"</option>";
S2.value="1";
load(); nowInit();
bind("colH","th");
bind("colM","tm");
fill("colH",24,parseInt(val("th")||"7"));
fill("colM",60,parseInt(val("tm")||"30"));

function nowInit(){
  try{
    var d=new Date();
    var bj=new Date(d.getTime()+
        d.getTimezoneOffset()*60000+
        8*3600000);
    var hh=bj.getHours();
    var mm=bj.getMinutes();
    var w=bj.getDay();
    if(w===0) w=7;
    document.getElementById("th").value=
      ("0"+hh).slice(-2);
    document.getElementById("tm").value=
      ("0"+mm).slice(-2);
    document.getElementById("wd").value=w;
    ISH=isHol();
  }catch(e){}
}


var HOL=[
"2026-01-01","2026-01-02","2026-01-03",
"2026-02-15","2026-02-16","2026-02-17",
"2026-02-18","2026-02-19","2026-02-20",
"2026-02-21","2026-02-22","2026-02-23",
"2026-04-04","2026-04-05","2026-04-06",
"2026-05-01","2026-05-02","2026-05-03",
"2026-05-04","2026-05-05",
"2026-06-19","2026-06-20","2026-06-21",
"2026-09-25","2026-09-26","2026-09-27",
"2026-10-01","2026-10-02","2026-10-03",
"2026-10-04","2026-10-05","2026-10-06",
"2026-10-07"
];
function isHolDate(s){
  return HOL.indexOf(s)>=0;
}
function wdOfDate(s){
  try{
    var a=s.split("-");
    var d=new Date(a[0],a[1]-1,a[2]);
    var w=d.getDay();
    return (w===0)?7:w;
  }catch(e){return 1;}
}
function hoNow(){
  return isHolDate(val("dt"));
}
function updHint(){
  try{
    var h=document.getElementById("hint");
    if(!h) return;
    if(hoNow()){
      h.style.display="block";
      h.innerHTML="⚠️ 所选日期为法定"+
        "节假日，当日不实施桥隧"+
        "错峰通行。";
    }else{
      h.style.display="none";
    }
  }catch(e){}
}
function syncDay(){
  try{
    var e=document.getElementById("dt");
    document.getElementById("wd").value=
      wdOfDate(e.value);
    updHint();
  }catch(ex){}
}
(function(){
  try{
    var d=new Date();
    var bj=new Date(d.getTime()+
        d.getTimezoneOffset()*60000+
        8*3600000);
    var ds=bj.getFullYear()+"-"+
      ("0"+(bj.getMonth()+1)).slice(-2)+"-"+
      ("0"+bj.getDate()).slice(-2);
    document.getElementById("dt").value=ds;
    document.getElementById("th").value=
      ("0"+bj.getHours()).slice(-2);
    document.getElementById("tm").value=
      ("0"+bj.getMinutes()).slice(-2);
    syncDay();
    document.getElementById("dt")
      .addEventListener("change",syncDay);
    fill("colH",24,parseInt(val("th")||"7"));
    fill("colM",60,parseInt(val("tm")||"30"));
  }catch(e){}
})();

(function(){
  try{
    var d=document.getElementById("brl");
    for(var i=0;i<AB.length;i++)
      d.innerHTML+="<option value='"+AB[i]+
        "'></option>";
  }catch(e){}
})();

function updSug(){
  try{
    var v=document.getElementById("rs").value.trim();
    var box=document.getElementById("sug");
    var h="",n=0;
    for(var i=0;i<AB.length;i++){
      if(v&&AB[i].indexOf(v)<0&&
         v.indexOf(AB[i])<0) continue;
      h+="<span onclick='pick(\""+AB[i]+"\")' "+
         "style='display:inline-block;"+
         "margin:6px 6px 0 0;padding:8px 14px;"+
         "background:#eef3fb;color:#2563eb;"+
         "border-radius:18px;font-size:14px'>"+
         AB[i]+"</span>";
      n++;
      if(n>=8) break;
    }
    box.innerHTML=h;
    box.style.display=h?"block":"none";
  }catch(e){}
}
function pick(t){
  document.getElementById("rs").value=t;
  document.getElementById("sug").style.display="none";
}
(function(){
  try{
    var e=document.getElementById("rs");
    e.addEventListener("input",updSug);
    e.addEventListener("focus",updSug);
  }catch(e){}
})();
function fm(x){
var h=Math.floor(x/60),q=x%60;
return h>0?h+' 小时 '+q+' 分':q+' 分钟';}
function updCd(){try{
var d=new Date();
var bj=new Date(d.getTime()+
d.getTimezoneOffset()*60000+28800000);
var m=bj.getHours()*60+bj.getMinutes();
var e=document.getElementById('cd'),t;
if(m<420)t='距离早高峰还有 '+fm(420-m);
else if(m<=540)t='现在处于早高峰，还有 '+fm(540-m)+' 结束';
else if(m<1020)t='距离晚高峰还有 '+fm(1020-m);
else if(m<=1170)t='现在处于晚高峰，还有 '+fm(1170-m)+' 结束';
else t='今日高峰时段已结束';
