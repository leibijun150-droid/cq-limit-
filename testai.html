<!doctype html><meta charset=utf-8><h3>智谱 CORS 测试</h3><input id=k placeholder=Key style=width:100%><button onclick=go()>测试</button><pre id=o></pre><script>function go(){var k=document.getElementById('k').value.trim(),o=document.getElementById('o');o.textContent='请求中...';fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:'glm-4-flash',messages:[{role:'user',content:'你好'}]})}).then(function(r){return r.text()}).then(function(t){o.textContent='OK '+t}).catch(function(e){o.textContent='FAIL '+e})}</script>
